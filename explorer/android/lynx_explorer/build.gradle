apply plugin: 'com.android.application'
apply plugin: 'kotlin-android'
apply plugin: 'kotlin-android-extensions'
apply plugin: 'kotlin-kapt'


android {
    // Add copyPrebuiltSoFiles task for LynxExplorer
    def copyPrebuiltSoFiles = tasks.register("copyPrebuiltSoFiles") {
        doLast {
            def abis = project.hasProperty('abiList') ? project.abiList.split(',') : rootProject.ext.abiList
            def flavor = "noasan"
            def buildType = "Debug"
            
            abis.each { abi ->
                def destDir = file("src/main/jniLibs/${abi}")
                destDir.mkdirs()
                
                // Copy from various dependency modules
                def modulePaths = [
                    "../../../../lynx/platform/android/lynx_android/build/intermediates/cmake/${flavor}${buildType}/obj/${abi}",
                    "../../../../lynx/base/trace/android/build/intermediates/cmake/${flavor}${buildType}/obj/${abi}",
                    "../../../../lynx/devtool/base_devtool/android/base_devtool/build/intermediates/cmake/${flavor}${buildType}/obj/${abi}",
                    "../../../../lynx/platform/android/lynx_devtool/build/intermediates/cmake/${flavor}${buildType}/obj/${abi}"
                ]
                
                def soFiles = ["liblynx.so", "liblynx_v8_bridge.so", "liblynxtrace.so", "libbasedevtool.so", "liblynxdevtool.so"]
                
                modulePaths.each { modulePath ->
                    soFiles.each { soFile ->
                        def src = file("${modulePath}/${soFile}")
                        if (src.exists()) {
                            copy {
                                from src
                                into destDir
                            }
                        }
                    }
                }
            }
        }
    }

    // Make preBuild depend on this task if skipNativeBuild is set
    if (project.hasProperty('skipNativeBuild')) {
        preBuild.dependsOn copyPrebuiltSoFiles
    }
    compileSdkVersion rootProject.ext.compileSdkVersion

    defaultConfig {
        applicationId "com.lynx.explorer"
        minSdkVersion 24
        targetSdkVersion 32
        versionCode 1
        versionName "1.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"

        ndk {
          abiFilters "armeabi-v7a", "arm64-v8a", "x86", "x86_64"
        }

        packagingOptions {
            pickFirst 'lib/*/libc++_shared.so'
            pickFirst 'lib/*/liblynx.so'
            pickFirst 'lib/*/liblynxtrace.so'
            pickFirst '**/libnapi.so'
        }
    }

    signingConfigs {
        release {
            storeFile file(MYAPP_RELEASE_KEYSTORE_FILE)
            storePassword MYAPP_RELEASE_STORE_PASSWORD
            keyAlias MYAPP_RELEASE_KEY_ALIAS
            keyPassword MYAPP_RELEASE_KEY_PASSWORD
        }
    }

    buildTypes {
        release {
            minifyEnabled true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.release
        }
        debug {
          if (project.hasProperty('skipNativeBuild') && project.skipNativeBuild == 'true') {
            ndk {
              // Use prebuilt libraries for specified ABI
              if (project.hasProperty('abiList')) {
                abiFilters project.abiList.split(',')
              } else {
                abiFilters "x86_64"  // default fallback
              }
            }
          }
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    flavorDimensions "lynx"
    productFlavors {
        asan {
            dimension "lynx"
            matchingFallbacks = ["asan"]
        }
        noasan {
            dimension "lynx"
            matchingFallbacks= ["noasan"]
            getIsDefault().set(true)
        }
    }

    sourceSets {
        asan {
        if (project.hasProperty('skipNativeBuild') && project.skipNativeBuild == 'true') {
          jni.srcDirs = []  // Disable native code for Kotlin-only builds
        } else {
          jni.srcDirs = ["../../core/build/gen"]
        }
      }
      noasan {
        if (project.hasProperty('skipNativeBuild') && project.skipNativeBuild == 'true') {
          jni.srcDirs = []  // Disable native code for Kotlin-only builds
        } else {
          jni.srcDirs = ["../../core/build/gen"]
        }
      }

    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'androidx.core:core:1.6.0'
    implementation 'com.facebook.fresco:fresco:2.3.0'
    implementation 'com.facebook.fresco:animated-gif:2.3.0'
    implementation 'com.facebook.fresco:animated-webp:2.3.0'
    implementation 'com.facebook.fresco:webpsupport:2.3.0'
    implementation 'com.facebook.fresco:animated-base:2.3.0'

    implementation 'com.journeyapps:zxing-android-embedded:4.3.0'
    implementation "com.squareup.okhttp3:okhttp:4.9.0"
    implementation 'com.squareup.okhttp3:okhttp-urlconnection:4.4.0'
    implementation 'com.squareup.retrofit2:retrofit:2.7.0'
    implementation 'org.lynxsdk.lynx:v8so:11.1.277.3'

    implementation project(':LynxAndroid')
    implementation project(':LynxTestBench')

    implementation project(':lynx_service_log')
    implementation project(':lynx_service_image')
    implementation project(':lynx_service_devtool')
    implementation project(':lynx_service_http')
    implementation project(':LynxDevtool')
    implementation project(':LynxXElement')
    implementation project(':LynxXElement:Input')
    implementation 'androidx.activity:activity-ktx:1.6.1'
    kapt project(':LynxProcessor')
    compileOnly project(':LynxProcessor')
}
